<script>
(()=>{'use strict';
const INTERNAL_PREVIEW=false;
const CONTENT=JSON.parse(document.getElementById('content-json').textContent), MANIFEST=JSON.parse(document.getElementById('audio-json').textContent);
document.getElementById('build-badge').textContent=INTERNAL_PREVIEW?'Internal audio alpha v0.20':'Learner pilot v0.20';
document.getElementById('build-subtitle').textContent=INTERNAL_PREVIEW?'English-first Egyptian Arabic • Missions 1, 2 and 3 • audio candidates for internal testing':'English-first Egyptian Arabic • Missions 1, 2 and 3 • pilot-approved audio';
const assets=Object.fromEntries(MANIFEST.assets.map(a=>[a.id,a]));
const missions=Object.fromEntries(CONTENT.missions.map(m=>[m.id,m]));
const app=document.getElementById('app'), key=`speak-arabi-alpha-v020-${INTERNAL_PREVIEW?'internal':'pilot'}`;
const missionState=(first)=>({current:first,history:[],complete:false,speaking:'pending',wrong:0,listeningEvidence:{independent:[],supported:[]},assessmentTrace:{},previewCount:0});
const empty=()=>({version:20,active:null,missions:{M1:missionState('m1-intro'),M2:missionState('m2-address'),M3:missionState('m3-bridge')},micExplained:false});
let state;try{state=JSON.parse(localStorage.getItem(key))||empty();if(state.version!==20)state=empty()}catch{state=empty()}
for(const id of ['M1','M2','M3'])if(state.missions[id]?.speaking==='recorded')state.missions[id].speaking='pending';
let ephemeral={feedback:null,preview:false,played:new Set(),activeAudio:null,audioToken:0,audioFailure:new Set(),micNotice:'',consentOpen:false,processing:false,rec:null,stream:null,chunks:[],blobUrl:null,recordToken:0,requestToken:0,recordMission:null,recordActivity:null};
const save=()=>{try{localStorage.setItem(key,JSON.stringify(state))}catch{}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ms=()=>state.missions[state.active];
const mission=()=>missions[state.active];
const resolveAddress=item=>({...item,line:item.lineByAddress?.[state.address]||item.line,audio:item.audioByAddress?.[state.address]||item.audio,label:item.labelByAddress?.[state.address]||item.label,title:item.titleByAddress?.[state.address]||item.title,...(item.lines?{lines:item.lines.map(resolveAddress)}:{}),...(item.sceneLines?{sceneLines:item.sceneLines.map(resolveAddress)}:{}),...(item.options?{options:item.options.map(resolveAddress)}:{}),...(item.then?{then:resolveAddress(item.then)}:{}),...(item.turns?{turns:item.turns.map(resolveAddress)}:{}),...(item.check?{check:{...item.check,options:item.check.options.map(resolveAddress)}}:{})});
const activity=()=>{const raw=mission()?.activities.find(a=>a.id===ms().current);if(!raw)return null;const a=resolveAddress(raw);if(a.type==='conversation'){const turn=ms().conversationTurn||0,t=a.turns[turn];return {...a,...t,title:a.title,id:t.id,baseId:a.id,character:t.speaker,options:t.reply.options,shuffleOptions:true,listenAssessment:true,hideTextUntilAttempt:false,hideCharacterUntilAttempt:false,listenAssessment:false}}return a};
const line=id=>CONTENT.language[id];
const assetReady=id=>!!id&&!!assets[id]?.file&&(assets[id]?.status==='approved'||(INTERNAL_PREVIEW&&assets[id]?.status==='internal_candidate'))&&!ephemeral.audioFailure.has(id);
const audioId=a=>a.audio||(a.id==='m3-recover'?ms().repairAudio:null);
const trace=a=>ms().assessmentTrace[a.id]||(ms().assessmentTrace[a.id]={normalPlays:0,slowPlays:0,wrong:0,preview:false,hint:false});
const lastPlayed=a=>!!(a.id==='m3-recover'&&ms().repairHeard)||(a.listenAssessment&&(trace(a).normalPlays+trace(a).slowPlays)>0)||ephemeral.played.has(`${a.id}:${audioId(a)}`)||!!(a.secondaryAudio&&ephemeral.played.has(`${a.id}:${a.secondaryAudio}`));
const heardRequired=a=>a.type==='phrase'?a.lines.every(x=>ephemeral.played.has(`${a.id}:${x.audio}`)):lastPlayed(a);
function audioButton(id,label='Play Egyptian audio'){const ok=assetReady(id);return `<button type="button" class="audio-button" data-action="audio" data-id="${esc(id)}" ${ok?'':'disabled'}>${ok?'▶ '+esc(label):'Audio not available for this build'}</button>`}
function textBlock(id){const l=line(id);return l?`<div class="arabic" lang="ar" dir="rtl">${esc(l.arabic)}</div><div class="franco" lang="en" dir="ltr">${esc(l.franco)}</div><div class="english" lang="en">${esc(l.english)}</div>`:''}
function character(id,hidden){const c=CONTENT.characters[id];if(!c)return '';if(hidden)return `<div class="character"><div class="portrait ${esc(c.color)}" aria-hidden="true"></div><div><div class="name">Someone is speaking</div><div class="role">Name hidden until you answer</div></div></div>`;return `<div class="character"><div class="portrait ${esc(c.color)}" aria-hidden="true"></div><div><div class="name">${esc(c.name)}</div><div class="role">${esc(c.role)}</div></div></div>`}
function scene(a){if(!a.character&&!a.line)return '';const hidden=!!a.hideTextUntilAttempt&&(!ephemeral.preview||a.type==='conversation');const hideWho=hidden&&!!a.hideCharacterUntilAttempt;return `<div class="scene">${character(a.character,hideWho)}<div class="bubble">${hidden?'<p class="tiny">Listen first. The script stays hidden until your answer.</p>':(a.sceneLines?a.sceneLines.map(x=>textBlock(x.line)).join(''):textBlock(a.line))}</div><div class="audio-block">${audioButton(audioId(a),'Hear '+(hideWho?'the line':(CONTENT.characters[a.character]?.name||'the line')))}</div>${INTERNAL_PREVIEW&&a.requireAudio&&!assetReady(audioId(a))&&!ephemeral.preview?'<button type="button" class="secondary" data-action="preview">Continue with script preview (internal only)</button>':INTERNAL_PREVIEW&&hidden&&!assetReady(audioId(a))?'<button type="button" class="secondary" data-action="preview">Reveal script for internal flow</button>':''}</div>`}
function optionLabel(o){return o.line?(state.active==='M2'?rowText(o.line):textBlock(o.line)):`<span>${esc(o.label)}</span>`}
function feedback(){return ephemeral.feedback?`<div class="feedback ${ephemeral.feedback.type}" role="status">${esc(ephemeral.feedback.text)}</div>`:''}
const optionOrders=new Map();
function orderedOptions(a){if(!a.shuffleOptions)return a.options;if(!optionOrders.has(a.id)){const ids=a.options.map(o=>o.id);for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}optionOrders.set(a.id,ids)}return optionOrders.get(a.id).map(id=>a.options.find(o=>o.id===id))}
function options(a){const blocked=!!a.listenAssessment&&!ephemeral.preview&&!lastPlayed(a);return `<div role="group" aria-label="Answer choices">${orderedOptions(a).map(o=>`<div><button type="button" class="option" data-action="option" data-id="${esc(o.id)}" ${blocked?'disabled':''}>${optionLabel(o)}</button>${o.audio?`<div class="audio-block">${audioButton(o.audio,'Hear this phrase')}</div>`:''}</div>`).join('')}</div>`}
function internalNote(a){return INTERNAL_PREVIEW&&a.listenAssessment&&!lastPlayed(a)?'<div class="notice">Internal interaction preview. This answer cannot count as listening evidence until an audio clip plays to the end.</div>':''}
function phraseList(a,map=false){return a.lines.map((x,i)=>`<div class="card">${map?`<strong>${i+1}. ${esc(line(x.line).franco)}</strong><div class="english">${esc(line(x.line).english)}</div>`:textBlock(x.line)+audioButton(x.audio,'Replay phrase')}</div>`).join('')}
function teachView(a,intro){const heard=lastPlayed(a);return intro+`<div class="card">${textBlock(a.line)}${audioButton(a.audio,'Hear model')}<p class="tiny">${esc(a.note)}</p></div>`+(a.then?`<h2>${esc(CONTENT.characters[a.then.character].name)} says it to you</h2>`+scene(a.then):'')+feedback()+(a.check?`<h2>${esc(a.check.question)}</h2>`+options({...a,options:a.check.options,shuffleOptions:true,listenAssessment:true}):a.speaking?(heard?speakingView({...a,modelAudio:a.audio},''):'<p class="tiny">Play the model before speaking practice.</p>'):`<button type="button" class="primary" data-action="next" ${a.requireAudio&&!heard?'disabled':''}>Continue</button>`)}
function orderView(a,intro){const picked=ms().orderPicked||[];const entries=a.lines.map((x,i)=>({...x,id:String(i)}));return intro+'<p class="lead">Tap the four lines in the right order.</p>'+picked.map(i=>`<div class="card">${textBlock(a.lines[i].line)}</div>`).join('')+feedback()+orderedOptions({id:a.id,shuffleOptions:true,options:entries}).filter(x=>!picked.includes(Number(x.id))).map(x=>`<button type="button" class="option" data-action="order" data-id="${x.id}">${textBlock(x.line)}</button>`).join('')+(picked.length===4?'<button type="button" class="primary" data-action="next">Continue</button>':'')}
function conversationView(a,intro){return intro+scene(a)+`<h2>${esc(a.reply.prompt)}</h2>`+feedback()+(ms().conversationAnswered?'<button type="button" class="primary" data-action="next">Continue</button>':options(a))}
function renderActivity(a){const intro=`<p class="eyebrow">Mission ${mission().number} · ${esc(mission().title)}</p><h1>${esc(a.title)}</h1>${a.body?`<p class="lead">${esc(a.body)}</p>`:''}`;
  if(a.type==='missionMap')return intro+'<h2>5 new phrases</h2>'+phraseList(a,true)+'<button type="button" class="primary" data-action="next">Start</button>';
  if(a.type==='teach')return teachView(a,intro);
  if(a.type==='order')return orderView(a,intro);
  if(a.type==='conversation')return conversationView(a,intro);
  if(a.type==='recap')return resultView(a,intro+'<h2>You can now:</h2><ul>'+a.canNow.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>'+phraseList(a));
  if(a.type==='addressChoice')return intro+`<button type="button" class="primary" data-action="address" data-id="m">As a man</button><button type="button" class="primary" data-action="address" data-id="f">As a woman</button>`;
  if(a.type==='intro' ||a.type==='scene')return intro+scene(a)+feedback()+`<button type="button" class="primary" data-action="next" ${a.requireAudio&&!heardRequired(a)&&!ephemeral.preview?'disabled':''}>${esc(a.button||'Continue')}</button>`;
  if(a.type==='choice')return intro+scene(a)+internalNote(a)+feedback()+options(a)+(a.secondaryAudio?`<div class="audio-block">${audioButton(a.secondaryAudio,'Hear slower version')}</div>`:'')+(a.hint?`<button type="button" class="quiet" data-action="hint">Need a hint?</button>${trace(a).hint?`<div class="notice">${esc(a.hint)} This answer will count as supported listening.</div>`:''}`:'');
  if(a.type==='branch')return intro+feedback()+options(a);
  if(a.type==='phrase')return intro+a.lines.map(x=>`<div class="card">${textBlock(x.line)}<div class="audio-block">${audioButton(x.audio,'Hear model')}</div></div>`).join('')+(INTERNAL_PREVIEW&&a.requireAudio&&!a.lines.every(x=>assetReady(x.audio))&&!ephemeral.preview?'<button type="button" class="secondary" data-action="preview">Continue with script preview (internal only)</button>':'')+`<button type="button" class="primary" data-action="next" ${a.requireAudio&&!heardRequired(a)&&!ephemeral.preview?'disabled':''}>${esc(a.button||'Continue')}</button>`;
  if(a.type==='speaking')return speakingView(a,intro);
  if(a.type==='result')return resultView(a,intro);
  return `<div class="notice">Unsupported activity type: ${esc(a.type)}</div>`;
}
function speakingView(a,intro){const status=ms().speaking;return intro+feedback()+`<p class="lead">Record and compare when you can. Quiet Mode and Practice Later keep the lesson moving.</p><div class="card">${textBlock(a.line)}<div class="audio-block">${audioButton(a.modelAudio,'Hear model')}</div><p class="tiny">Speaking status: <strong>${esc(status)}</strong></p>${ephemeral.micNotice?`<div class="feedback bad" role="status">${esc(ephemeral.micNotice)}</div>`:''}<div class="controls"><button type="button" class="secondary" data-action="record" ${ephemeral.processing?'disabled':''}>${ephemeral.processing?'Preparing take…':ephemeral.rec?.state==='recording'?'■ Stop recording':'● Record'}</button><button type="button" class="quiet" data-action="quiet">Quiet Mode</button></div><button type="button" class="quiet" data-action="later">Practice Later</button>${ephemeral.blobUrl?`<div class="check"><p>Take created. Replay it before marking speaking practice complete.</p><audio id="take-player" class="record-player" controls src="${esc(ephemeral.blobUrl)}"></audio><button type="button" class="quiet" data-action="delete">Delete take</button></div>`:''}${status==='replayed'?'<button type="button" class="primary" data-action="next">Continue after replay</button>':''}</div><p class="tiny">The take stays in page memory only. It is never uploaded or scored. Reloading removes the take while preserving lesson progress.</p>`+(ephemeral.consentOpen?`<div class="check" role="dialog" aria-modal="true" aria-label="Microphone explanation"><h2>Before you record</h2><p class="tiny">This microphone take stays in this browser page session. It is not uploaded or used for pronunciation scoring. You can replay, delete, use Quiet Mode, or practice later. Closing or reloading the page deletes the take.</p><button type="button" class="primary" data-action="consent">Continue to microphone permission</button><button type="button" class="quiet" data-action="quiet">Use Quiet Mode</button><button type="button" class="quiet" data-action="later">Practice Later</button></div>`:'');}
function resultView(a,intro){
  const s=ms();s.complete=true;save();
  const independent=s.listeningEvidence.independent.length;
  const supported=s.listeningEvidence.supported.length;
  const total=independent+supported;
  const speakingLabel=s.speaking==='replayed'?'Recorded and replayed':s.speaking==='skipped'?'Quiet Mode':s.speaking==='recorded'?'Recording made; replay pending':'Practice later';
  const listeningNote=state.active==='M2'?'You practised replies to lines taught in this mission.':state.active==='M1'
    ?'These checks used greetings you had already met. They count as listening practice.'
    :independent>0?'You caught the new name on the first normal play.':supported>0?'You identified the new name after extra listening or a hint.':'No listening answer was counted yet.';
  return intro+feedback()+`<div class="result-grid"><div class="card"><strong>${total}</strong><span>Listening checks completed</span></div><div class="card"><strong>${esc(speakingLabel)}</strong><span>Speaking practice</span></div></div><p class="lead">${esc(listeningNote)}</p>${s.speaking==='pending'?'<p class="tiny">Speaking is saved for later. You can finish this mission without using the microphone.</p>':''}<p class="tiny">This records lesson actions. It does not grade pronunciation or speaking ability.</p>${INTERNAL_PREVIEW?'<p class="tiny">Internal audio test: learner-pilot approval is still pending.</p>':''}<button type="button" class="secondary" data-action="home">Mission list</button>`;
}
function home(){return `<p class="eyebrow">L0-01 · ${INTERNAL_PREVIEW?'Internal alpha':'Learner pilot'}</p><h1>Meet. Reply. Repair.</h1><p class="lead">Try three short Egyptian Arabic journeys. Progress saves on this device, including where you stopped.</p>${INTERNAL_PREVIEW?'<div class="notice">This internal build plays synthetic audio candidates. Ali&#39;s individual pronunciation and learner-pilot approvals remain pending. Script previews cannot earn listening evidence.</div>':''}${CONTENT.missions.map(m=>{const s=state.missions[m.id];return `<div class="card"><div class="row"><h2>${String(m.number).padStart(2,'0')} · ${esc(m.title)}</h2><span class="status">${s.complete?'Choice path complete':s.current===m.activities[0].id?'Ready':'In progress'}</span></div><p class="tiny">${esc(m.outcome)}</p><button type="button" class="primary" data-action="open" data-id="${m.id}">${s.current===m.activities[0].id?'Start':'Resume'} Mission ${m.number}</button><button type="button" class="quiet" data-action="restart" data-id="${m.id}">Restart mission</button></div>`}).join('')}<p class="tiny">Original character portraits are early visual studies. No AI Teacher or urgent-help content is included.</p>`}
function render(){document.getElementById('back').hidden=!state.active;const a=state.active?activity():null;document.getElementById('footnote').textContent=a?`Mission ${mission().number} · ${mission().activities.findIndex(x=>x.id===(a.baseId||a.id))+1} of ${mission().activities.length}`:'Progress saves on this device';document.getElementById('progress-bar').style.width=a?`${100*mission().activities.findIndex(x=>x.id===(a.baseId||a.id))/(mission().activities.length-1)}%`:'0%';app.innerHTML=a?renderActivity(a):home();const player=document.getElementById('take-player');if(player){const missionId=state.active,activityId=a.id,blobUrl=ephemeral.blobUrl;player.addEventListener('ended',()=>{if(state.active!==missionId||activity()?.id!==activityId||ephemeral.blobUrl!==blobUrl)return;ms().speaking='replayed';save();const note=app.querySelector('.card .tiny strong');if(note)note.textContent='replayed';if(!app.querySelector('[data-action="next"]')){const b=document.createElement('button');b.className='primary';b.type='button';b.dataset.action='next';b.textContent='Continue after full replay';app.querySelector('.card').appendChild(b)}})}}
function nextId(a){if(a.baseId)a={...a,id:a.baseId};const i=mission().activities.findIndex(x=>x.id===a.id);return a.next||mission().activities[i+1]?.id}
function clearBlob(){if(ephemeral.blobUrl)URL.revokeObjectURL(ephemeral.blobUrl);ephemeral.blobUrl=null;ephemeral.chunks=[]}
function releaseRecording({discard=true}={}){ephemeral.recordToken++;ephemeral.requestToken++;ephemeral.audioToken++;ephemeral.activeAudio?.pause();ephemeral.activeAudio=null;ephemeral.processing=false;const rec=ephemeral.rec;ephemeral.rec=null;if(rec){rec.ondataavailable=null;rec.onstop=null;rec.onerror=null;try{if(rec.state==='recording')rec.stop()}catch{}}ephemeral.stream?.getTracks().forEach(t=>t.stop());ephemeral.stream=null;if(discard){if(state.active&&ms()?.speaking==='recorded')ms().speaking='pending';clearBlob()}ephemeral.recordMission=null;ephemeral.recordActivity=null;}
function move(id,note=null,recordVisit=true){if(recordVisit&&state.active&&ms().current!==id)ms().history.push(ms().current);releaseRecording();ephemeral.preview=false;ephemeral.feedback=null;ephemeral.micNotice='';ephemeral.consentOpen=false;ms().current=id;if(state.address&&activity()?.type==='addressChoice')ms().current=nextId(activity());save();render()}
function open(id){releaseRecording();state.active=id;ephemeral.feedback=null;if(state.address&&activity()?.type==='addressChoice')ms().current=nextId(activity());save();render()}
function goHome(){releaseRecording();state.active=null;ephemeral.feedback=null;save();render()}
function restart(id){releaseRecording();ephemeral.played.clear();ephemeral.audioFailure.clear();ephemeral.preview=false;ephemeral.feedback=null;state.missions[id]=empty().missions[id];state.active=id;ephemeral.feedback=null;if(state.address&&activity()?.type==='addressChoice')ms().current=nextId(activity());save();render()}
function goBack(){if(!state.active)return;const previous=ms().history.pop();if(!previous)return goHome();move(previous,null,false)}
function answer(id){const a=activity();if(a.type==='teach'){if(!lastPlayed(a))return;const o=a.check?.options.find(x=>x.id===id);if(!o)return;tone(!!o.correct);if(o.correct)move(nextId(a),{type:'ok',text:'That works.'});else{ms().wrong++;ephemeral.feedback={type:'bad',text:'Try again.'};save();render()}return}
if(a.type==='conversation'){if(ms().conversationAnswered)return;const o=a.options.find(x=>x.id===id);if(!o)return;tone(!!o.correct);const t=trace(a);if(o.correct){const eligible=a.assessment?.firstPassEligible&&!a.assessment?.priorExactExposure&&t.normalPlays===1&&t.wrong===0&&!t.preview&&!t.hint&&!t.slowPlays;const evidence=ms().listeningEvidence;for(const group of ['independent','supported'])evidence[group]=evidence[group].filter(x=>x!==a.id);evidence[eligible?'independent':'supported'].push(a.id);ms().conversationAnswered=true;ephemeral.feedback={type:'ok',text:'That works. Here is what Karim said.'}}else{ms().wrong++;t.wrong++;ephemeral.feedback={type:'bad',text:'Listen again and try your reply.'}}save();render();return}
const o=a.options.find(x=>x.id===id);if(!o)return;if(a.listenAssessment&&!lastPlayed(a)&&!(INTERNAL_PREVIEW&&ephemeral.preview))return;if(a.type!=='branch')tone(!!o.correct);if(a.type==='branch'){if(a.id==='m3-repair'||a.id==='m3-clarify'){ms().repairRoute=o.id==='unclear'?'unclear':o.id;ms().repairAudio=o.next==='m3-slow'?'m3_mariam_name_slow':'m3_mariam_name_repeat';ms().repairHeard=false}move(o.next);return}if(o.correct){if(a.listenAssessment&&lastPlayed(a)&&!ephemeral.preview){const t=trace(a),eligible=a.assessment?.firstPassEligible&&!a.assessment?.priorExactExposure&&t.normalPlays===1&&t.slowPlays===0&&t.wrong===0&&!t.preview&&!t.hint;const evidence=ms().listeningEvidence;for(const group of ['independent','supported'])evidence[group]=evidence[group].filter(x=>x!==a.id);evidence[eligible?'independent':'supported'].push(a.id)}save();move(nextId(a),{type:'ok',text:a.correctFeedback||'That works.'})}else{ms().wrong++;if(a.listenAssessment)trace(a).wrong++;ephemeral.feedback={type:'bad',text:a.wrongFeedback||'Try again.'};save();render()}}
async function playAudio(id){if(!assetReady(id))return;ephemeral.activeAudio?.pause();const sound=new Audio(assets[id].file),current=activity(),missionId=state.active,token=++ephemeral.audioToken;ephemeral.activeAudio=sound;let sequenceIndex=0;const sequence=current.sceneLines&&id===current.audio?current.sceneLines.map(x=>x.audio):[id];sound.onended=()=>{if(token!==ephemeral.audioToken||state.active!==missionId||activity()?.id!==current.id)return;if(++sequenceIndex<sequence.length){sound.src=assets[sequence[sequenceIndex]].file;sound.play().catch(()=>{ephemeral.audioFailure.add(sequence[sequenceIndex]);render()});return}ephemeral.played.add(`${current.id}:${id}`);if(current.listenAssessment){const t=trace(current);if(id===current.secondaryAudio)t.slowPlays++;else if(id===current.audio)t.normalPlays++;save()}if(current.id==='m3-repeat'||current.id==='m3-slow'){ms().repairHeard=true;save()}render()};try{await sound.play()}catch{if(token!==ephemeral.audioToken)return;ephemeral.audioFailure.add(id);ephemeral.feedback={type:'bad',text:INTERNAL_PREVIEW?'Audio could not be opened. This remains an internal preview.':'Audio could not be opened. Please try again.'};render()}}
function preview(){if(!INTERNAL_PREVIEW)return;ephemeral.preview=true;ms().previewCount++;const a=activity();if(a.listenAssessment)trace(a).preview=true;save();render()}
function hint(){const a=activity();if(!a.hint)return;trace(a).hint=true;save();render()}
async function requestMic(){if(!state.micExplained){ephemeral.consentOpen=true;render();return}const a=activity(),token=++ephemeral.requestToken;try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});if(token!==ephemeral.requestToken||!state.active||activity()?.id!==a.id){stream.getTracks().forEach(t=>t.stop());return}ephemeral.stream=stream;ephemeral.chunks=[];clearBlob();const rec=new MediaRecorder(stream);const recToken=++ephemeral.recordToken;ephemeral.rec=rec;ephemeral.recordMission=state.active;ephemeral.recordActivity=a.id;ephemeral.processing=false;ms().speaking='pending';save();rec.ondataavailable=e=>{if(recToken===ephemeral.recordToken&&e.data?.size)ephemeral.chunks.push(e.data)};rec.onstop=()=>{if(recToken!==ephemeral.recordToken||ephemeral.rec!==rec||state.active!==ephemeral.recordMission||activity()?.id!==ephemeral.recordActivity)return;ephemeral.processing=false;const blob=new Blob(ephemeral.chunks,{type:rec.mimeType||'audio/webm'});ephemeral.stream?.getTracks().forEach(t=>t.stop());ephemeral.stream=null;ephemeral.rec=null;ephemeral.chunks=[];if(!blob.size){ephemeral.micNotice='No audio was captured. Record again, use Quiet Mode, or practice later.';render();return}clearBlob();ephemeral.blobUrl=URL.createObjectURL(blob);ms().speaking='recorded';save();render()};rec.onerror=()=>{releaseRecording();ephemeral.micNotice='Recording stopped unexpectedly. You can try again or continue without the microphone.';render()};rec.start();ephemeral.micNotice='Recording locally. Tap Stop recording when finished.';render()}catch{if(token!==ephemeral.requestToken)return;ephemeral.stream?.getTracks().forEach(t=>t.stop());ephemeral.stream=null;ephemeral.micNotice='Microphone permission was denied or is unavailable. Quiet Mode and Practice Later still work.';render()}}
function stopByUser(){const rec=ephemeral.rec;if(rec?.state==='recording'){try{ephemeral.processing=true;rec.stop();ephemeral.micNotice='Preparing your take…';render()}catch{ephemeral.processing=false;ephemeral.micNotice='Could not stop recording. Use Quiet Mode or Practice Later.';render()}}}
function speakDecision(kind){if(activity()?.type==='conversation'){releaseRecording();ms().speaking=kind==='quiet'?'skipped':'pending';(ms().recordDone??={})[activity().id]=true;save();render();return;}if(activity()?.type==='teach'&&!lastPlayed(activity()))return;const id=state.active;releaseRecording();state.missions[id].speaking=kind==='quiet'?'skipped':'pending';save();move(nextId(activity()))}
function deleteTake(){clearBlob();ms().speaking='pending';save();ephemeral.micNotice='Take deleted. Speaking practice is pending.';render()}
app.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const action=b.dataset.action,id=b.dataset.id;if(action==='order'){const a=activity();if(a.type!=='order')return;const picked=ms().orderPicked||(ms().orderPicked=[]);if(Number(id)===picked.length){picked.push(Number(id));ephemeral.feedback=null}else{ms().wrong++;ephemeral.feedback={type:'bad',text:'Try the next line in the exchange.'}}save();render()}else if(action==='address'){if(!['m','f'].includes(id))return;state.address=id;save();move(nextId(activity()))}else if(action==='open')open(id);else if(action==='restart')restart(id);else if(action==='home')goHome();else if(action==='next'){const a=activity();if(a.type==='conversation'){if(!ms().conversationAnswered)return;if(a.recordAfter&&!ms().recordDone?.[a.id]&&ms().speaking!=='replayed')return;if((ms().conversationTurn||0)<a.turns.length-1){releaseRecording();ms().conversationTurn=(ms().conversationTurn||0)+1;ms().conversationAnswered=false;ephemeral.feedback=null;save();render();return}ms().conversationTurn=0;ms().conversationAnswered=false;move(nextId(a));return}if(a.type==='order'&&ms().orderPicked?.length!==4)return;if(a.type==='teach'&&a.speaking&&ms().speaking!=='replayed')return;if(a.type==='speaking'&&ms().speaking!=='replayed')return;if(a.requireAudio&&!heardRequired(a)&&!(INTERNAL_PREVIEW&&ephemeral.preview))return;move(nextId(a))}else if(action==='option')answer(id);else if(action==='audio')playAudio(id);else if(action==='preview')preview();else if(action==='hint')hint();else if(action==='record'){if(ephemeral.rec?.state==='recording')stopByUser();else requestMic()}else if(action==='consent'){state.micExplained=true;ephemeral.consentOpen=false;save();requestMic()}else if(action==='quiet'||action==='later')speakDecision(action);else if(action==='delete')deleteTake()});
document.getElementById('back').addEventListener('click',goBack);document.getElementById('home').addEventListener('click',goHome);window.addEventListener('beforeunload',()=>{releaseRecording();ephemeral.activeAudio?.pause()});
let toneContext;
function tone(right){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;toneContext??=new C();toneContext.resume().catch(()=>{});const start=toneContext.currentTime;for(let i=0;i<(right?2:1);i++){const o=toneContext.createOscillator(),g=toneContext.createGain(),at=start+i*.13,d=right?.12:.2;o.type=right?'sine':'sawtooth';o.frequency.value=right?(i?660:440):110;g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(.09,at+.01);g.gain.exponentialRampToValueAtTime(.0001,at+d);o.connect(g);g.connect(toneContext.destination);o.start(at);o.stop(at+d)}}catch{}}
function diffText(a,b,arabic=false){const x=Array.from(a),y=Array.from(b);let p=0,s=0;while(p<Math.min(x.length,y.length)&&x[p]===y[p])p++;while(s<Math.min(x.length,y.length)-p&&x[x.length-1-s]===y[y.length-1-s])s++;const mid=x.slice(p,x.length-s).join('');if(!mid||mid.length>a.length/2||(arabic&&/^[\u064b-\u065f]+$/.test(mid)))return esc(a);return esc(x.slice(0,p).join(''))+'<span class="diff">'+esc(mid)+'</span>'+esc(x.slice(x.length-s).join(''));}
function rowText(id,other){const l=line(id),r=other?line(other):null;return `<div class="arabic" lang="ar" dir="rtl">${r?diffText(l.arabic,r.arabic,true):esc(l.arabic)}</div><div class="franco">${r?diffText(l.franco,r.franco):esc(l.franco)}</div><div class="english" hidden>${esc(l.english)}</div>`}
function phraseRow(x){if(x.pair)return `<div class="card phrase-row" tabindex="0" role="button" aria-label="Show or hide English"><div class="pair-grid">${['m','f'].map(g=>`<div><p class="gender">${g==='m'?'♂ to a man':'♀ to a woman'}</p>${rowText(x.pair[g],x.pair[g==='m'?'f':'m'])}${audioButton(x.audioPair[g],'Hear phrase')}</div>`).join('')}</div></div>`;return `<div class="card phrase-row" tabindex="0" role="button" aria-label="Show or hide English">${rowText(x.line)}${audioButton(x.audio,'Hear phrase')}</div>`}
function recordView(a){return `<p class="lead">${esc(a.instruction||a.recordAfter)}</p>`+speakingView({...a,line:a.line||'mariamName',modelAudio:a.audio||'m3_mariam_name_normal'},'').replaceAll('Quiet Mode</button>','Skip (Quiet Mode)</button>');}
const legacyRender=renderActivity;
renderActivity=function(a){const intro=`<p class="eyebrow">Mission ${mission().number} · ${esc(mission().title)}</p><h1>${esc(a.title)}</h1>${a.body?`<p class="lead">${esc(a.body)}</p>`:''}`,next='<button class="primary" data-action="next">Continue</button>';
if(a.type==='missionMap')return intro+a.lines.map(phraseRow).join('')+'<button class="primary" data-action="next">Start</button>';
if(a.type==='teachPair')return intro+phraseRow(a)+`<p class="tiny">${esc(a.note)}</p>`+next;
if(a.type==='teach')return intro+(a.headline?`<p class="lead">${esc(a.headline)}</p>`:'')+(a.arrowPair?a.arrowPair.map(phraseRow).join('<p aria-label="then">→</p>'):phraseRow(a))+(a.note?`<p class="tiny">${esc(a.note)}</p>`:'')+next;
if(a.type==='record')return intro+recordView(a);
if(a.type==='listenGender'){const l=ms().gender??={order:Math.random()<.5?['m','f']:['f','m'],index:0,answered:false};save();const g=l.order[l.index];return intro+audioButton(a.audioPair[g],'Hear phrase')+feedback()+(l.answered?phraseRow({line:a.pair[g],audio:a.audioPair[g]})+'<button class="primary" data-action="genderNext">Continue</button>':`<button class="option" data-action="gender" data-id="m">♂ To a man</button><button class="option" data-action="gender" data-id="f">♀ To a woman</button>`);}
if(a.type==='match'){const done=ms().matched??=[],left=ms().matchLeft;return intro+'<p class="lead">Tap a left card then a right card.</p>'+feedback()+`<div class="match-grid"><div>${orderedOptions({id:a.id+'left',shuffleOptions:true,options:a.lines}).map(x=>`<div class="${done.includes(x.id)?'locked':''}"><button class="option ${left===x.id?'selected':''}" data-action="matchLeft" data-id="${x.id}" ${done.includes(x.id)?'disabled':''}>${rowText(x.line)}${done.includes(x.id)?'✓ → '+esc(line(a.replies.find(r=>r.id===x.reply).line).franco):''}</button>${audioButton(x.audio,'Hear phrase')}</div>`).join('')}</div><div>${orderedOptions({id:a.id+'right',shuffleOptions:true,options:a.replies}).map(x=>`<div class="${a.lines.some(l=>l.reply===x.id&&done.includes(l.id))?'locked':''}"><button class="option" data-action="matchRight" data-id="${x.id}">${rowText(x.line)}</button>${audioButton(x.audio,'Hear example')}${x.reusable?'<p class="tiny">Can be used twice</p>':''}</div>`).join('')}</div></div>`+(done.length===3?next:'');}
if(a.type==='conversation')return intro+`<div class="scene">${character(a.character,false)}<div class="bubble phrase-row" tabindex="0" role="button" aria-label="Show or hide English">${a.sceneLines?a.sceneLines.map(x=>rowText(x.line)).join(''):rowText(a.line)}</div>${audioButton(a.audio,'Hear Karim')}</div>`+feedback()+(ms().conversationAnswered?(a.recordAfter&&!ms().recordDone?.[a.id]?recordView({...a,line:'mariamName',audio:'m3_mariam_name_normal'}):next):'<h2>What do you say?</h2>'+options(a));
if(a.type==='recap'){ms().complete=true;save();return intro+a.lines.map(phraseRow).join('')+`<p class="lead">${esc(a.nextMission)}</p><p class="tiny">Speaking practice is not graded.</p><button class="primary" data-action="home">Mission list</button>`;}
return legacyRender(a);};
const originalMove=move;
move=function(...args){originalMove(...args);if(activity()?.type==='listenGender'){const a=activity();playAudio(a.audioPair[ms().gender.order[ms().gender.index]])}};
app.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b){const row=e.target.closest('.phrase-row');if(row)row.querySelectorAll('.english').forEach(x=>x.hidden=!x.hidden);return;}const action=b.dataset.action,id=b.dataset.id,a=activity();if(action==='gender'){const s=ms().gender,g=s.order[s.index];tone(id===g);s.answered=true;ephemeral.feedback={type:id===g?'ok':'bad',text:id===g?'That works.':g==='m'?'This is said to a man.':'This is said to a woman.'};save();render();if(id!==g)playAudio(a.audioPair[g]);}else if(action==='genderNext'){const s=ms().gender;if(s.index===0){s.index++;s.answered=false;ephemeral.feedback=null;save();render();playAudio(a.audioPair[s.order[s.index]])}else{if(!ms().listeningEvidence.supported.includes(a.id))ms().listeningEvidence.supported.push(a.id);move(nextId(a));}}else if(action==='matchLeft'){ms().matchLeft=id;save();render();}else if(action==='matchRight'){const l=a.lines.find(x=>x.id===ms().matchLeft);if(!l)return;tone(l.reply===id);if(l.reply===id){ms().matched.push(l.id);ms().matchLeft=null;ephemeral.feedback={type:'ok',text:'That works.'};if(ms().matched.length===3&&!ms().listeningEvidence.supported.includes(a.id))ms().listeningEvidence.supported.push(a.id)}else{ms().wrong++;ephemeral.feedback={type:'bad',text:'Try again.'}}save();render();}},true);
app.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.phrase-row')){e.preventDefault();e.target.querySelectorAll('.english').forEach(x=>x.hidden=!x.hidden)}});

render();
})();
